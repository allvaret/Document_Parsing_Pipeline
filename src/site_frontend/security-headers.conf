# Mesmos cabeçalhos de public/_headers (Cloudflare Pages). Incluído em cada location porque
# add_header num location apaga os do nível acima. __API_ORIGIN__ é trocado no Dockerfile.prod pela origem de VITE_API_URL.
add_header X-Content-Type-Options nosniff always;
add_header Referrer-Policy no-referrer always;
add_header X-Frame-Options DENY always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self' __API_ORIGIN__; base-uri 'none'; form-action 'self'; frame-ancestors 'none'" always;
