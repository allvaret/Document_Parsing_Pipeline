services:
  frontend:
    build: .
    ports:
      - "5173:5173"
    volumes:
      # Sincroniza seus arquivos locais com o container em tempo real
      - .:/app
      # Protege o node_modules do container para não ser sobrescrito
      - /app/node_modules
    environment:
      - CHOKIDAR_USEPOLLING=true # Garante o Hot Reload em qualquer SO (Windows/Linux/Mac)