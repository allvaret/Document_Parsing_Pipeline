server {
  listen 8080;
  server_tokens off;
  root /usr/share/nginx/html;
  index index.html;

  # SPA: rotas como /calculadora e /relatorios/3 caem no index.html.
  location / {
    include /etc/nginx/security-headers.conf;
    try_files $uri /index.html;
  }
  location /assets/ {
    include /etc/nginx/security-headers.conf;
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }
}
