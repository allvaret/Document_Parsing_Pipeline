[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "finance-data-platform"
version = "1.0.0"
description = "Financial report parser and structured document processing pipeline."
authors = [
    {name = "Alvaro Danko"}
]
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pdfplumber>=0.11",
    "PyMuPDF>=1.26.7,<=2.1",
    "spacy>=3.8,<3.9",
    "numpy>=1.26",
    "requests>=2.32",
    "pandas>=2.2",
    "rapidfuzz>=3.0",
    "fastapi>=0.115",
    "pydantic>=2.7",
    "uvicorn>=0.30",
    "sqlalchemy>=2.0,<2.1",
    "alembic>=1.13",
    "psycopg[binary]>=3.2",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx2>=2.16"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
resumo = ["data/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
# Reintroduzir `import fitz` (API legada do PyMuPDF) quebra os testes: use `import pymupdf`.
filterwarnings = ["error:.*fitz.*:FutureWarning"]
markers = [
    "integration: precisa do PDF de exemplo, do ticker_map e do modelo spaCy",
]
