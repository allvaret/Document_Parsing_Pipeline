[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "finance-data-platform"
version = "1.0.0"
description = "Financial report parser and structured document processing pipeline."
authors = [
    {name = "Alvaro Danko"}
]
readme = "README.md"
requires-python = ">=3.11"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
