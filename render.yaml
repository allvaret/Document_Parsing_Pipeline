# Blueprint do Render: só a API (o banco é o Neon; o site é o Cloudflare Pages).
# Passo a passo e variáveis: docs/DEPLOY.md
services:
  - type: web
    name: finance-api
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    envVars:
      - key: PORT
        value: "8000"
      # Atrás do proxy do Render o IP real vem em X-Forwarded-For (limite de requisições por IP).
      - key: FORWARDED_ALLOW_IPS
        value: "*"
      - key: ENABLE_DOCS
        value: "0"
      # Preenchidos no painel (sync: false = o valor não fica no repositório):
      - key: READONLY_DATABASE_URL   # URL do Neon do role finance_ro, com ?sslmode=require
        sync: false
      - key: CORS_ORIGINS            # URL do site no Cloudflare Pages, sem barra final
        sync: false
      - key: ALLOWED_HOSTS           # host da API + 127.0.0.1, ex.: finance-api.onrender.com,127.0.0.1
        sync: false
