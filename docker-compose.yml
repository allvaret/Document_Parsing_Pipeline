# Tudo com um comando (precisa do .env com POSTGRES_PASSWORD):
#   docker compose up --build        # site em http://localhost:8080, API em http://localhost:8000
# Só o Postgres (desenvolvimento e testes; nunca para produção):
#   docker compose up -d db
#   docker compose down        # mantém os dados (volume `pgdata`)
#   docker compose down -v     # apaga os dados
# A senha vem do .env (ignorado pelo git); nada sensível neste arquivo.
# Porta 5433 no host, para não colidir com um Postgres instalado na máquina.
services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: finance
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD no .env (veja .env.example)}
      POSTGRES_DB: finance
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      # Roda só na 1ª criação do volume: cria o banco dos testes.
      - ./docker/postgres-init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U finance -d finance"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Cria/atualiza o role só-leitura da API (idempotente) e termina.
  db-roles:
    image: postgres:17-alpine
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD}
      READONLY_POSTGRES_PASSWORD: ${READONLY_POSTGRES_PASSWORD:?defina READONLY_POSTGRES_PASSWORD no .env (veja .env.example)}
    volumes:
      - ./database/readonly_role.sql:/readonly_role.sql:ro
    command: ["sh", "-c", "psql -h db -U finance -d finance -v ON_ERROR_STOP=1 -v pw=\"$$READONLY_POSTGRES_PASSWORD\" -f /readonly_role.sql"]
    depends_on:
      db:
        condition: service_healthy

  # Migrações (Alembic) com a URL do dono do banco; termina ao acabar.
  migrate:
    image: finance-api
    build: .
    command: ["alembic", "upgrade", "head"]
    environment:
      DATABASE_URL: postgresql+psycopg://finance:${POSTGRES_PASSWORD}@db:5432/finance
    depends_on:
      db-roles:
        condition: service_completed_successfully

  # API somente leitura: só conhece a URL do role finance_ro. O banco começa vazio
  # (rode o batch ou restaure um dump: scripts/dump_banco.sh).
  api:
    image: finance-api
    environment:
      READONLY_DATABASE_URL: postgresql+psycopg://finance_ro:${READONLY_POSTGRES_PASSWORD}@db:5432/finance
      CORS_ORIGINS: http://localhost:8080
      ALLOWED_HOSTS: localhost,127.0.0.1
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      migrate:
        condition: service_completed_successfully

  # Site estático (nginx). A URL da API é fixada no build e usada pelo navegador.
  web:
    build:
      context: src/site_frontend
      dockerfile: Dockerfile.prod
      args:
        VITE_API_URL: http://localhost:8000
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      api:
        condition: service_healthy

volumes:
  pgdata:
